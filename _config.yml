title: PieTTY project
description: A terminal forked from PuTTY by piaip
# Served as https://hungte.github.io/pietty/ (project page of hungte/pietty).
# Set baseurl to "" if you use a custom domain or a user site instead.
baseurl: "/pietty"
url: "https://hungte.github.io"
lang: zh-Hant
# Used by jekyll-github-metadata (site.github.releases) on the download page.
repository: hungte/pietty

author: Hung-Te Lin (piaip)

# Both plugins are supported (whitelisted) on GitHub Pages.
plugins:
  - jekyll-seo-tag    # <title>, description, canonical URL, Open Graph.
  - jekyll-sitemap    # /sitemap.xml for Google Search Console.

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

nav:
  - title: HOME
    url: /
  - title: DOWNLOAD
    url: /download.html
  - title: FAQ
    url: /faq.html

exclude:
  - README.md
  - _raw
  - _tools
  - _preview

defaults:
  # Keep the Google Search Console verification file out of sitemap.xml.
  - scope:
      path: "google*.html"
    values:
      sitemap: false
